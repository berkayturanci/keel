version: 2
updates:
  # Keep pinned GitHub Actions SHAs current (CI, CodeQL, Scorecard, publish, pages).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "area:ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Track Python tooling/build dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
    groups:
      python-tooling:
        patterns:
          - "*"

  # The hash-locked release tooling for publish.yml. It lives outside "/", so the
  # entry above never sees it: Dependabot still raises *alerts* for this file but
  # opens no PR to fix them, which left a setuptools advisory sitting open with no
  # route to being fixed. Ungrouped on purpose — a bump here must be reviewed on its
  # own, because publish.yml runs only on a v* tag, so a bad pin surfaces during a
  # release rather than in CI.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
    ignore:
      # cyclonedx-bom — the SBOM generator publish.yml runs — requires chardet<6.0,
      # so a major bump here is unsatisfiable, not merely risky: #757 proposed 7.5.1
      # and pip refused the whole install. Dependabot cannot infer the bound, because
      # this is a flat pin file carrying no dependency graph; it bumps the line it can
      # read. Minor and patch updates still come through. Drop this rule when
      # cyclonedx-bom relaxes the bound — the `release lockfiles resolve` CI job is
      # what will tell you whether it has.
      - dependency-name: "chardet"
        update-types: ["version-update:semver-major"]

  # Keep local pre-commit hook pins current.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
