name: Feature Request
description: Suggest an improvement for keel
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What behavior would you like? If it's a step/gate, which backbone slot would it use?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This belongs in the project-neutral core, not as a downstream project's config/Lego.
          required: true
