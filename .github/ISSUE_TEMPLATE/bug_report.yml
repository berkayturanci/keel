name: Bug Report
description: Report a reproducible bug in keel
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: The exact command and a minimal `.keel/project.yaml` (or example config) needed to reproduce.
      placeholder: |
        1. Run `keel ...`
        2. See error `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Python version:
        - keel version (`keel --version`):
        - Command / surface (CLI, /keel:<command>, which agent):
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues first.
          required: true
        - label: I removed secrets, tokens, and private repository data from logs.
          required: true
