name: PR description lint

# Enforce that every PR carries a real description AND declares the issues it
# touches. A GitHub PR template only pre-fills the body — it cannot stop a PR
# being opened/merged empty. This check makes that a hard, required signal. Pure
# stdlib Python, no dependencies; reads the PR body from the event payload via an
# env var (never interpolated into the shell, to avoid script injection from PR
# text).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  description:
    name: PR has a real description + linked issue
    runs-on: ubuntu-latest
    steps:
      # Checkout so the check can read the PR template and discount any line the
      # author left verbatim (placeholders, checklists) — comparing against the
      # template is more robust than hard-coding placeholder strings.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # GitHub's own classification of the account, which is what the bot
          # exemption keys on — not the login, whose `[bot]` suffix is a naming
          # convention standing in for this field. Read as env vars like
          # PR_BODY, never interpolated into the shell.
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        # The rules live in a module so they can be tested in both directions
        # (#963). An exemption asserted only against the workflow's text proves
        # the string is there, not that a human PR is still refused.
        run: python3 .github/scripts/pr_description_lint.py

