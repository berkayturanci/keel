name: keel-ship

# Run keel against real PRs on GitHub's free hosted runner. The runner already has
# git + an authenticated gh (GITHUB_TOKEN), so `keel ship` can read the diff and the
# PR's CI status, post its assessment as a comment, and gate the merge on the decision.
#
# Consumers copy this workflow and swap `pip install -e .` for a pinned keel install
# (`pip install "git+https://github.com/berkayturanci/keel@v1.19.0"`) and the config path
# for their own `.keel/project.yaml`.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to assess (optional)"
        required: false
      deferral:
        description: "Optional evidence deferral id, kind, or all"
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  ship:
    name: keel ship (assessment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # full history so keel can diff against the base branch
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install keel plus dev tools (ruff, coverage)
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Make base branch available locally
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "$BASE:$BASE" || true
      - name: Run keel ship (informational)
        id: ship
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          set +e
          ARGS=(.keel/project.yaml --root .)
          if [ -n "$PR" ]; then
            ARGS+=(--pr "$PR")
          fi
          keel ship "${ARGS[@]}" | tee ship.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          { echo '### 🚢 keel ship'; echo '```'; cat ship.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment assessment on the PR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CODE: ${{ steps.ship.outputs.code }}
        run: |
          {
            echo '### 🚢 keel ship'
            echo
            echo '```'
            cat ship.txt
            echo '```'
            echo
            echo "_decision exit code: ${CODE} (0 = not BLOCK). Informational — not a required gate._"
          } > body.md
          gh pr comment "$PR" --body-file body.md

  evidence:
    # Deliberately NOT "keel evidence (required)". Actions names this job's own
    # check after the job, and that check is driven by the exit code — it can only
    # ever say "the job ran". The gating signal is the check-run the step below
    # publishes under that name, and two same-named checks on one commit would be
    # indistinguishable to branch protection, which matches by name.
    name: keel evidence (verify)
    runs-on: ubuntu-latest
    # Ordered after `ship` on purpose. Arming falls through to the ship-assessment
    # comment for any branch outside evidence._SHIP_BRANCH_RE, and that comment is
    # written by the `ship` job — running the two in parallel let this gate read the
    # PR before the comment existed and pass having checked nothing.
    needs: ship
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event.inputs.pr != '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install keel
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Verify posted ship evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          DEFERRAL: ${{ github.event.inputs.deferral }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_NAME: keel evidence (required)
        run: |
          # --phase pre-merge: the closure comments are an s11 artifact, posted after
          # the merge this gate authorizes, so requiring them here is unsatisfiable.
          # --require-armed: an unarmed gate must not report success, or a green check
          # cannot be told apart from one that never evaluated anything.
          ARGS=(.keel/project.yaml --root . --pr "$PR" --phase pre-merge --require-armed)
          if [ -n "$DEFERRAL" ]; then
            ARGS+=(--deferral "$DEFERRAL")
          fi

          # On workflow_dispatch there is no pull_request payload. Falling back to
          # $GITHUB_SHA would stamp the verdict for PR $PR onto whatever ref the run
          # was dispatched from — normally the default branch — and check-runs cannot
          # be deleted. Resolve the PR's real head instead.
          HEAD_SHA="$PR_HEAD_SHA"
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          fi

          set +e
          keel evidence-verify "${ARGS[@]}"
          RC=$?
          set -e

          # Publish the verdict as its own check-run instead of leaning on this job's
          # exit code. A job that exits 0 concludes green, which is how a gate named
          # for the evidence chain reported success with zero verdicts posted (#928).
          #
          # The waiting state is published as an *incomplete* run, not as a
          # conclusion. #829 specified `neutral` on the belief that it still blocks;
          # GitHub's branch protection documentation says the opposite -- "Required
          # status checks must have a `successful`, `skipped`, or `neutral` status
          # before collaborators can make changes to a protected branch" -- so
          # neutral would have satisfied the required check while no evidence
          # existed, reproducing #928 by another route. An incomplete run blocks the
          # merge and renders as a yellow dot, which is the not-red signal #829 was
          # actually after. It completes once the evidence resolves.
          publish_check() {
            local status="$1" conclusion="$2" title="$3" summary="$4"
            local args=(-X POST "repos/${GITHUB_REPOSITORY}/check-runs"
                        -f "name=${CHECK_NAME}"
                        -f "head_sha=${HEAD_SHA}"
                        -f "status=${status}"
                        -f "output[title]=${title}"
                        -f "output[summary]=${summary}")
            if [ -n "$conclusion" ]; then
              args+=(-f "conclusion=${conclusion}")
            fi
            gh api "${args[@]}" >/dev/null
          }

          # Fail-closed, and applied to every arm rather than only to the waiting
          # one: a fork PR's token is read-only whatever `permissions:` says, so the
          # API call can fail in any state. A gate that could not deliver its verdict
          # has not delivered a pass, and that is as true of the passing arm as of
          # the waiting one.
          publish_or_fail() {
            if publish_check "$@"; then
              return 0
            fi
            echo "::error title=Could not publish the evidence check-run::Reporting the verdict to GitHub failed, so this step fails rather than leaving the gate unreported. On a pull request from a fork the token is read-only and cannot create check runs."
            exit 1
          }

          case "$RC" in
            0)
              echo "Evidence verification passed."
              publish_or_fail completed success "Evidence verified" \
                "All required evidence for the pre-merge phase is present and pinned to \`$HEAD_SHA\`."
              exit 0
              ;;
            2)
              echo "::notice title=Waiting for review evidence::Evidence gate is in pre-verdict state (waiting for review evidence). Merge remains blocked until all required verdicts pass."
              {
                echo "### ⏳ keel evidence (waiting)"
                echo
                echo "Evidence gate is in pre-verdict state — waiting for required reviewer and jury verdicts."
                echo "_Merge remains blocked until required evidence is posted and verified._"
              } >> "$GITHUB_STEP_SUMMARY"
              publish_or_fail in_progress "" "Waiting for review evidence" \
                "Pre-verdict state: required reviewer and jury verdicts are not posted yet. This check stays incomplete, which blocks a merge, until the evidence resolves."
              exit 0
              ;;
            *)
              echo "::error title=Evidence verification failed::Explicit evidence violation or finding detected."
              echo "Evidence verification failed (invalid evidence or findings detected)."
              publish_or_fail completed failure "Evidence verification failed" \
                "Explicit evidence violation: a closure comment that does not match the ledger record, a missing attribution label, or an unarmed gate. Run \`keel evidence-verify\` locally for the itemised report."
              exit 1
              ;;
          esac
