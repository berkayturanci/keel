name: Publish keel-visual to PyPI and GitHub Release

# keel-visual is a separate distribution from the core (keel-workflow). It has its
# own release tag namespace (keel-visual-v*) so it never collides with core's v*
# releases, and its own trusted-publisher config on PyPI. Release the core it
# depends on (the `keel-workflow` floor in keel-visual/pyproject.toml) first.
on:
  workflow_dispatch:
  push:
    tags:
      - "keel-visual-v*"

# Least-privilege default for the whole workflow; the job below elevates only the
# scopes it needs (OpenSSF Scorecard TokenPermissions).
permissions:
  contents: read

jobs:
  build-n-publish:
    name: Build, Publish, and Release keel-visual
    runs-on: ubuntu-latest
    # measured 0.9 min; it is a publish job, so it is sized like one.
    timeout-minutes: 30
    permissions:
      id-token: write       # PyPI trusted publishing (OIDC) + provenance attestation
      contents: write       # create the GitHub Release and upload assets
      attestations: write   # build-provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # Refuse a tag that does not name the version the tree declares, before
      # anything is built (#1371). Both publish steps below use
      # `skip-existing: true`, so a keel-visual-v0.9.1 tag on a tree still at
      # 0.9.0 would skip the upload as "already there", and a tag on a tree
      # someone bumped past it would publish a version the tag does not name —
      # green either way. Stdlib-only, like core's guard in publish.yml, so it
      # runs before the hash-locked install and cannot fail for a dependency.
      - name: Check keel-visual's version agrees with the tag
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            python scripts/release_check.py --package keel-visual --tag "$TAG"
          else
            # Manual dispatch is the TestPyPI rehearsal: there is no tag to compare.
            python scripts/release_check.py --package keel-visual
          fi

      - name: Install build dependencies
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r .github/requirements/publish-visual-tools.txt

      # Build the keel-visual package (in keel-visual/) into a top-level dist/.
      # --no-isolation uses the hash-locked hatchling installed above; the
      # force-include in keel-visual/pyproject.toml ships the HTML templates.
      - name: Build keel-visual distributions
        run: python -m build --no-isolation --sdist --wheel --outdir dist/ keel-visual

      # Every template in the source tree, not a list of them: this checked
      # runviz.html alone, and swarm.html was missing from the force-include
      # without anything noticing (#1371). An empty glob fails too, so a moved
      # directory cannot pass by checking nothing.
      - name: Verify every template shipped in the wheel
        run: |
          python - <<'PY'
          import glob, pathlib, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(whl).namelist())
          source = pathlib.Path("keel-visual/src/keel_visual/templates")
          templates = sorted(path.name for path in source.glob("*.html"))
          if not templates:
              sys.exit(f"no templates found under {source}")
          missing = [t for t in templates if f"keel_visual/templates/{t}" not in names]
          if missing:
              sys.exit(f"templates missing from {whl}: {', '.join(missing)}")
          print(f"{len(templates)} templates present in {whl}: {', '.join(templates)}")
          PY

      # CycloneDX SBOM for the built package. Written to release/ (NOT dist/) so the
      # PyPI upload sees only the wheel + sdist.
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install --no-deps dist/*.whl
          mkdir -p release
          cyclonedx-py environment --output-format JSON --output-file release/sbom.cdx.json

      # A single SHA256SUMS over every release artifact (kept out of dist/ for the
      # same reason as the SBOM).
      - name: Generate checksums
        run: |
          cp dist/*.whl dist/*.tar.gz release/
          cd release
          sha256sum *.whl *.tar.gz sbom.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      # TestPyPI trusted publishing (OIDC, no token). Manual dispatch is the
      # rehearsal path; configure a TestPyPI trusted publisher for this repo +
      # workflow (publish-visual.yml) before use.
      - name: Publish keel-visual to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      # PyPI trusted publishing (OIDC, no token). Requires a one-time trusted-
      # publisher config on PyPI for the keel-visual project: this repo, workflow
      # publish-visual.yml. A failed publish fails the release loudly.
      - name: Publish keel-visual to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/keel-visual-v')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true

      - name: Create GitHub Release and Upload Packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/keel-visual-v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            release/*.whl
            release/*.tar.gz
            release/sbom.cdx.json
            release/SHA256SUMS
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
