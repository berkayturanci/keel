name: pages

# Build the keel website + coverage report and deploy to GitHub Pages.
# keel is public, so we auto-deploy on push to main. `configure-pages` with
# enablement enables Pages programmatically (build type: GitHub Actions), so no
# manual Settings step is required.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        with:
          enablement: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install keel plus dev tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Build coverage report + badge into the site
        run: |
          coverage run -m unittest discover -s tests
          coverage html -d website/coverage
          coverage json -o coverage.json
          python - <<'PY'
          import json
          pct = round(json.load(open("coverage.json"))["totals"]["percent_covered"], 2)
          color = ("brightgreen" if pct >= 90 else "green" if pct >= 80
                   else "yellowgreen" if pct >= 70 else "yellow" if pct >= 60 else "red")
          json.dump(
              {"schemaVersion": 1, "label": "coverage", "message": f"{pct:g}%", "color": color},
              open("website/coverage-badge.json", "w"),
          )
          json.dump(
              {"schemaVersion": 1, "label": "keel", "message": "13 steps verified", "color": "0d9488"},
              open("website/backbone-badge.json", "w"),
          )
          json.dump(
              {"schemaVersion": 1, "label": "keel-swarm", "message": "DAG orchestrated", "color": "38bdf8"},
              open("website/swarm-badge.json", "w"),
          )
          print(f"coverage badge: {pct:g}% ({color})")
          PY
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
      # Tell IndexNow-participating engines (Bing — and through Bing, ChatGPT and
      # Copilot search — plus Yandex, Seznam, Naver) that the site changed,
      # instead of waiting to be crawled. Runs *after* the deploy so a URL is
      # never announced before it is live, and continue-on-error so a
      # search-engine ping can never fail a deploy that already succeeded.
      #
      # The key is public by design: the engine fetches it from keyLocation to
      # prove we control the host, so it is committed rather than a secret.
      # Cloudflare's Crawler Hints cannot do this here — the apex is DNS-only so
      # GitHub can issue the certificate, and Cloudflare never sees the traffic.
      # The deploy job has no checkout, so the sitemap is read from the live
      # site — announcing what the live site serves. (A briefly stale CDN copy
      # right after deploy is possible and benign: stale-list URLs are still
      # live pages, and announcing a just-deleted URL is spec-legal.)
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET

          KEY = "9d98afd3150f289ca4806a2a775bdae6fc35fc3972cd90dba2ed949180eed533"
          HOST = "keel-ship.dev"
          NS = "{http://www.sitemaps.org/schemas/sitemap/0.9}"

          with urllib.request.urlopen(f"https://{HOST}/sitemap.xml", timeout=30) as r:
              root = ET.fromstring(r.read())
          urls = [e.text.strip() for e in root.iter(NS + "loc") if e.text]
          if not urls:
              raise SystemExit("live sitemap listed no URLs - nothing to submit")

          body = json.dumps({
              "host": HOST,
              "key": KEY,
              "keyLocation": f"https://{HOST}/{KEY}.txt",
              "urlList": urls,
          }).encode()
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=body,
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              print(f"IndexNow: HTTP {r.status} for {len(urls)} URL(s)")
          PY

