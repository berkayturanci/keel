name: pages

# Build the keel website + coverage report and deploy to GitHub Pages.
# Manual-only (workflow_dispatch): this repo is private and serves the site
# locally (`make site`), so we don't auto-deploy. Enable GitHub Pages
# (Settings → Pages → Source: GitHub Actions) and run this manually to publish.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install keel plus dev tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Build coverage report into the site
        run: |
          coverage run -m unittest discover -s tests
          coverage html -d website/coverage
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
