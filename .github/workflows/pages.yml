name: pages

# Build the keel website + coverage report and deploy to GitHub Pages.
# keel is public, so we auto-deploy on push to main. `configure-pages` with
# enablement enables Pages programmatically (build type: GitHub Actions), so no
# manual Settings step is required.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        with:
          enablement: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install keel plus dev tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Build coverage report + badge into the site
        run: |
          coverage run -m unittest discover -s tests
          coverage html -d website/coverage
          coverage json -o coverage.json
          python - <<'PY'
          import json
          pct = round(json.load(open("coverage.json"))["totals"]["percent_covered"], 2)
          color = ("brightgreen" if pct >= 90 else "green" if pct >= 80
                   else "yellowgreen" if pct >= 70 else "yellow" if pct >= 60 else "red")
          json.dump(
              {"schemaVersion": 1, "label": "coverage", "message": f"{pct:g}%", "color": color},
              open("website/coverage-badge.json", "w"),
          )
          print(f"coverage badge: {pct:g}% ({color})")
          PY
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
