name: pages

# Build the keel website + coverage report and deploy to GitHub Pages.
# keel is public, so we auto-deploy on push to main. `configure-pages` with
# enablement enables Pages programmatically (build type: GitHub Actions), so no
# manual Settings step is required.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install keel plus dev tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Build coverage report into the site
        run: |
          coverage run -m unittest discover -s tests
          coverage html -d website/coverage
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
