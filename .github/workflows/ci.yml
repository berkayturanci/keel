name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python coverage on every OS, including Windows, to prove the CLI's
        # cross-OS subprocess/path behaviour. The make-based dogfood step is skipped
        # on Windows (no `make`); the unit suite + config validation still run there.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test + coverage gate
        run: |
          coverage run -m unittest discover -s tests
          coverage report
      - name: Validate seed configs and dogfood config
        # bash so the projects/*.yaml glob expands the same way on every runner
        # (PowerShell does not pass through an unexpanded glob to the program).
        shell: bash
        run: python -m keel validate projects/*.yaml .keel/project.yaml
      - name: Dogfood — keel runs its own gates on keel-core
        # The dogfood gates shell out to `make` (build_gate_cmd/lint_cmd), which is
        # not available on the Windows runner; the unit suite already exercises the
        # gate-running core on every OS.
        if: runner.os != 'Windows'
        run: |
          python -m keel plan .keel/project.yaml --root .
          python -m keel run-gates .keel/project.yaml --root .
