name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python coverage on every OS, including Windows, to prove the CLI's
        # cross-OS subprocess/path behaviour. The make-based dogfood step is skipped
        # on Windows (no `make`); the unit suite + config validation still run there.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test + coverage gate
        # bash on every runner. The Windows default is PowerShell, whose script
        # exit status is that of its *last* statement — so a failing
        # `coverage run` was masked by a succeeding `coverage report` and the job
        # reported success with six failures and one error. It had been doing
        # that long enough for seven real failures to accumulate behind it
        # (#953). bash here runs with `-e`, so the first command's failure is
        # the step's failure, the same as on Linux and macOS.
        shell: bash
        run: |
          coverage run -m unittest discover -s tests
          coverage report
      - name: Validate seed configs and dogfood config
        # bash so the projects/*.yaml glob expands the same way on every runner
        # (PowerShell does not pass through an unexpanded glob to the program).
        shell: bash
        run: python -m keel validate projects/*.yaml .keel/project.yaml
      - name: Dogfood — keel runs its own gates on keel-core
        # The dogfood gates shell out to `make` (build_gate_cmd/lint_cmd), which is
        # not available on the Windows runner; the unit suite already exercises the
        # gate-running core on every OS.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m keel plan .keel/project.yaml --root .
          python -m keel run-gates .keel/project.yaml --root .

  format:
    # Its own job rather than a step in the 9-way test matrix: formatting is a
    # property of the tree, not of the interpreter or the OS, so checking it
    # nine times costs nine pinned installs to learn one fact.
    #
    # Without this the tree drifts back. `.pre-commit-config.yaml` declares
    # `ruff-format` as a *rewriting* hook, so before #966 a contributor who
    # installed the hooks got 126 unrelated files rewritten into their next
    # commit — silently, already staged. CI was green throughout, having only
    # ever run `ruff check`. A formatter is a shared convention only if
    # something asserts it.
    name: Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      # Pinned, and pinned to the SAME version as the `ruff-format` hook in
      # .pre-commit-config.yaml — `tests/test_ruff_pin.py` asserts they match.
      # The dev extra is an unpinned `ruff`, which is right for `check` (new
      # rules are worth picking up) and wrong behind a format gate: a floating
      # formatter turns every PR red the day ruff changes its style, for
      # reasons that have nothing to do with the change under review.
      - name: Install the pinned formatter
        run: python -m pip install --upgrade pip && pip install "ruff==0.16.4"
      - name: Format
        run: ruff format --check .

  external-promises:
    # The offline suite compares the repo against itself, which is how #772/#773/#774
    # all shipped green. This job is the only place the repo is compared against the
    # world: that a documented `uses:` resolves, and that the version does not
    # contradict what PyPI has published.
    name: external promises
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install runtime deps
        run: python -m pip install --upgrade pip && python -m pip install "PyYAML==6.0.3"
      - name: Verify external promises
        env:
          PYTHONPATH: src
          KEEL_CHECK_EXTERNAL: "1"
          # Lifts the anonymous API rate limit for the pin resolution below;
          # read-only, no extra scope needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m unittest tests.test_external_promises -v
          python -m unittest tests.test_action_pins -v

  release-lockfiles:
    # publish.yml runs only on a `v*` tag, so its hash-locked tooling is otherwise
    # first executed by the release itself. The unit test next to it checks the
    # file's *shape* — pinned with `==`, carries a sha256 — which both of the
    # broken Dependabot bumps in #779 satisfied while being unresolvable. Only an
    # actual resolution can tell a good pin from a bad one, so this runs the real
    # thing: same OS, same Python, same flags as publish.yml, minus the install.
    name: release lockfiles resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Must match publish.yml's Python: the files are locked to one ABI, and
          # resolving them under a different one proves nothing about the release.
          python-version: "3.13"
      - name: Resolve the hash-locked release tooling
        run: |
          for f in .github/requirements/publish-tools.txt \
                   .github/requirements/publish-visual-tools.txt; do
            echo "::group::$f"
            python -m pip install --dry-run --require-hashes --only-binary=:all: \
              --target "$(mktemp -d)" -r "$f"
            echo "::endgroup::"
          done

  test-visual:
    name: test-visual (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Exercise the optional keel-visual companion on every OS too, including
        # Windows. Its tests mock subprocess and have no OS-specific branches, so
        # the suite (and its own 100% coverage gate) holds cross-OS.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core + keel-visual, editable)
        # Install the local core first so keel-visual resolves keel-workflow from the
        # repo, then keel-visual itself with --no-deps (no PyPI fetch). coverage/ruff
        # come from the core dev extra.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e keel-visual --no-deps
      - name: Lint (ruff) — keel-visual
        run: ruff check keel-visual
      - name: Test + coverage gate (keel-visual)
        # keel-visual carries its own coverage config (source = keel_visual,
        # fail_under = 100) in keel-visual/pyproject.toml.
        # bash for the same reason as the core gate above: on PowerShell only the
        # last command's exit code reaches the step, so a failing `coverage run`
        # would be masked by a succeeding `coverage report` (#953).
        shell: bash
        run: |
          coverage run --rcfile=keel-visual/pyproject.toml -m unittest discover -s keel-visual/tests
          coverage report --rcfile=keel-visual/pyproject.toml
