name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test + coverage gate
        run: |
          coverage run -m unittest discover -s tests
          coverage report
      - name: Validate seed configs
        run: python -m keel.cli validate projects/*.yaml
      - name: Dogfood — keel runs its own gates on keel-core
        run: |
          python -m keel.cli plan projects/keel.yaml
          python -m keel.cli run-gates projects/keel.yaml --root .
