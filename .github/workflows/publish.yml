name: Publish to PyPI and GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Least-privilege default for the whole workflow; the job below elevates only the
# scopes it needs (OpenSSF Scorecard TokenPermissions).
permissions:
  contents: read

jobs:
  build-n-publish:
    name: Build, Publish, and Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # PyPI trusted publishing (OIDC) + provenance attestation
      contents: write       # create the GitHub Release and upload assets
      attestations: write   # build-provenance attestations
      # No `pull-requests: write`. Nothing after the tag writes to `main` any
      # more: the formula is rendered below and attached to the release instead
      # of being repaired in a follow-up pull request (#1023, #990).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # Refuse a release that does not agree with itself, before anything is built
      # or uploaded (#1024). PyPI files are immutable, so this is the last phase in
      # which a CHANGELOG still headed `## [Unreleased]`, a plugin manifest naming
      # the previous version, or a drifted keel-visual marker is still fixable.
      # Same guards as `make release-check`; stdlib-only, so it runs before the
      # hash-locked install below and cannot fail for a dependency's reasons.
      - name: Check the release surfaces agree
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            python scripts/release_check.py --tag "$TAG"
          else
            # Manual dispatch is the TestPyPI rehearsal: there is no tag to compare.
            python scripts/release_check.py
          fi

      - name: Install build dependencies
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r .github/requirements/publish-tools.txt

      # Reproducible builds, step 1 of 2. Without a fixed timestamp `python -m build`
      # stamps the current time into the archives, so two runs over the *same* tree
      # produce different bytes and different SHA256s. That is not cosmetic: PyPI
      # keeps the first upload (`skip-existing: true`), so a re-run at the same tag
      # would publish a GitHub Release describing artifacts PyPI never served, and
      # the verify job below would report a digest mismatch on a healthy release.
      #
      # Pinned to the tagged commit's own commit time, so the value is a property of
      # the tag rather than of when the runner started.
      - name: Pin SOURCE_DATE_EPOCH to the tagged commit
        run: |
          set -euo pipefail
          epoch="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=${epoch}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=${epoch} ($(date -u -d "@${epoch}" +%FT%TZ))"

      - name: Build package distributions
        run: python -m build --no-isolation --sdist --wheel --outdir dist/

      # Reproducible builds, step 2 of 2. SOURCE_DATE_EPOCH is necessary and not
      # sufficient: with the pinned setuptools 84.0.0 the wheel comes out
      # byte-identical but the sdist does not — its root directory member takes wall
      # clock through a PAX record, the gzip header carries its own mtime, and every
      # member carries the runner's uid/gid. scripts/normalize_sdist.py rewrites that
      # envelope (see its docstring for the measured digests). Runs before the SBOM,
      # the checksums, the attestation and the upload, so every downstream step sees
      # the archive that will actually be published.
      - name: Normalize the sdist for reproducibility
        run: python scripts/normalize_sdist.py dist/*.tar.gz

      # And then prove it, on this toolchain, on every release. A reproducibility
      # claim that is only ever asserted in a comment is how the sdist gap survived
      # the first round of this work: the wheel was checked, matched, and the sdist
      # was assumed to behave the same way. Build a second time into a scratch
      # directory and require both artifacts to hash identically.
      - name: Verify the build is reproducible
        run: |
          set -euo pipefail
          python -m build --no-isolation --sdist --wheel --outdir "${RUNNER_TEMP}/rebuild"
          python scripts/normalize_sdist.py "${RUNNER_TEMP}"/rebuild/*.tar.gz
          failed=0
          for original in dist/*; do
            name="$(basename "$original")"
            a="$(sha256sum "$original" | cut -d" " -f1)"
            b="$(sha256sum "${RUNNER_TEMP}/rebuild/${name}" | cut -d" " -f1)"
            echo "${name}"
            echo "  build 1: ${a}"
            echo "  build 2: ${b}"
            if [ "$a" != "$b" ]; then
              echo "::error title=Build is not reproducible::${name} differs between two builds of the same tree; a re-run at this tag would publish a checksum file describing artifacts PyPI never served"
              failed=1
            fi
          done
          rm -rf "${RUNNER_TEMP}/rebuild"
          [ "$failed" -eq 0 ]

      # CycloneDX software bill of materials for the built package. Written into
      # release/ (NOT dist/) so the PyPI upload sees only the wheel + sdist —
      # twine rejects non-distribution files in the upload dir. The SBOM still
      # ships with the GitHub Release.
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install --no-deps dist/*.whl
          mkdir -p release
          cyclonedx-py environment --output-format JSON --output-file release/sbom.cdx.json

      # A single SHA256SUMS over every release artifact so downloaders can verify
      # integrity with `sha256sum -c SHA256SUMS`. Staged in release/ next to the
      # dists (kept out of dist/ for the same reason as above).
      - name: Generate checksums
        run: |
          cp dist/*.whl dist/*.tar.gz release/
          cd release
          sha256sum *.whl *.tar.gz sbom.cdx.json > SHA256SUMS
          cat SHA256SUMS

      # Cryptographic attestation binding the artifacts to this workflow run,
      # verifiable with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      # TestPyPI trusted publishing: OIDC, no long-lived API token. Manual dispatch is
      # the rehearsal path; configure TestPyPI for this repo + workflow before use.
      - name: Publish package to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      # PyPI trusted publishing: OIDC, no long-lived API token. dist/ holds only
      # the wheel + sdist (SBOM/checksums live in release/). NOT continue-on-error:
      # a failed publish must fail the release loudly. `skip-existing` keeps re-runs
      # idempotent. Requires a one-time trusted-publisher config on PyPI for this
      # repo + workflow.
      - name: Publish package to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true

      # The formula, rendered from what the tag actually produced (#1023, #990).
      #
      # A committed Formula/keel.rb had to name a url and a sha256 that cannot
      # both be correct at once: the url is bumped in the release commit, and the
      # digest belongs to the archive GitHub builds *from the tag* — created from
      # that very commit. So the digest was stale on every release by
      # construction, and making it true cost a second write to `main`
      # afterwards: a pull request opened by this workflow that a human still had
      # to merge, and an hourly-failing tap sync whenever nobody did (#981).
      #
      # The tag exists by the time this step runs, so the pair is knowable *here*
      # and nowhere earlier. Rendering it at this moment removes the requirement
      # instead of repairing its symptom: nothing in the repository names a
      # digest, so nothing in the repository can be stale.
      #
      # This is the one thing the release constructs rather than copies. The
      # counter-argument (#779: a release step that builds something moves its
      # checks into the phase that runs once per tag) is answered by refusing
      # here rather than reporting — every failure below exits non-zero, and it
      # runs before the release is created, so a formula that cannot be verified
      # means no release rather than a bad formula.
      - name: Render the Homebrew formula from the tagged archive
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          # Bounded, and named so a test can assert the number rather than match
          # the loop's text. GitHub builds tag archives on demand; the first
          # request after a push occasionally 404s while the ref propagates.
          ARCHIVE_WAIT_ATTEMPTS: "10"
          ARCHIVE_WAIT_SECONDS: "6"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          archive="${RUNNER_TEMP}/tag-archive.tar.gz"

          fetched=""
          for attempt in $(seq 1 "$ARCHIVE_WAIT_ATTEMPTS"); do
            if curl -fsSL "$url" -o "$archive"; then
              fetched=1
              echo "fetched the tag archive on attempt ${attempt}"
              break
            fi
            echo "the tag archive is not being served yet (attempt ${attempt}/${ARCHIVE_WAIT_ATTEMPTS}); retrying in ${ARCHIVE_WAIT_SECONDS}s"
            sleep "$ARCHIVE_WAIT_SECONDS"
          done
          if [ -z "$fetched" ]; then
            echo "::error title=No tag archive::${url} did not resolve within the bounded wait; refusing to publish a formula whose digest nothing measured"
            exit 1
          fi

          digest="$(sha256sum "$archive" | cut -d" " -f1)"
          echo "url:    ${url}"
          echo "sha256: ${digest}"

          mkdir -p release
          sed -e "s|@URL@|${url}|g" \
              -e "s|@SHA256@|${digest}|g" \
              -e "s|@VERSION@|${version}|g" \
              packaging/homebrew/keel.rb.template > release/keel.rb

          # `sed` reports success whether or not it substituted anything, so a
          # renamed placeholder would ship a formula that cannot parse.
          left="$(grep -oE '@[A-Z0-9_]+@' release/keel.rb || true)"
          if [ -n "$left" ]; then
            echo "::error title=Unrendered placeholder::${left} survived rendering"
            exit 1
          fi

          # The guard #990 identified as the load-bearing one, asserted on the
          # rendered file rather than on the variables that produced it: the url
          # must be this project's archive for the version being released. A
          # digest comparison alone is satisfied by a formula that faithfully
          # describes somebody else's tarball.
          if ! grep -qF "  url \"https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz\"" release/keel.rb; then
            echo "::error title=Wrong url::the rendered formula does not name this repository's ${GITHUB_REF_NAME} archive"
            exit 1
          fi
          if ! grep -qE '^  sha256 "[0-9a-f]{64}"$' release/keel.rb; then
            echo "::error title=No digest::the rendered formula carries no top-level sha256"
            exit 1
          fi

          ( cd release && sha256sum keel.rb >> SHA256SUMS )
          cat release/keel.rb

      - name: Create GitHub Release and Upload Packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            release/*.whl
            release/*.tar.gz
            release/sbom.cdx.json
            release/SHA256SUMS
            release/keel.rb
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # First upload wins, matching PyPI's `skip-existing: true` above. The
          # action overwrites by default, so a workflow re-run at the same tag used
          # to replace SHA256SUMS with digests of a *rebuilt* artifact while PyPI
          # kept the original — the two records of one release then disagreed by
          # construction. Both sides now refuse to replace what was published.
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    # Everything after "the upload succeeded" used to be prose. `release_smoke.py`
    # was documented in docs/keel/release.md and wired into no workflow at all, and
    # "confirm the PyPI digests match the GitHub Release" was a sentence in a
    # runbook. This job is that paragraph, executed (#1024).
    #
    # It deliberately checks what PyPI *serves*, not what this run built: the
    # failure worth catching is a release that built fine and installs wrong.
    name: Verify the published release
    needs: build-n-publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout + `gh release download` of the SHA256SUMS asset
      issues: write    # open or update `release-broken: <tag>` when this fails
    env:
      TAG: ${{ github.ref_name }}
      LOG: ${{ github.workspace }}/verify.log
      # The bound on the index wait, named rather than inlined so a test can assert
      # the number instead of matching the loop's text. 20 x 15s = five minutes.
      PYPI_WAIT_ATTEMPTS: "20"
      PYPI_WAIT_SECONDS: "15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install from PyPI, smoke it, and cross-check the published digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # One step, teed to a log whose tail the failure handler below posts into an
        # issue. `set -o pipefail` keeps the tee from swallowing a non-zero exit.
        #
        # CONSTRAINT: nothing secret may reach $LOG — a public issue quotes its tail
        # verbatim. No secret is expanded into this step's script; GH_TOKEN is read
        # from the environment by `gh` and never echoed. The tail is additionally
        # passed through a token-shaped mask before it is posted (see below).
        run: |
          set -euo pipefail
          {
            set -euo pipefail
            version="${TAG#v}"
            req="keel-workflow==${version}"
            pypi="${RUNNER_TEMP}/pypi"
            meta="${RUNNER_TEMP}/pypi.json"
            mkdir -p "$pypi"

            echo "== waiting for PyPI to serve both distributions of ${version} =="
            # "Something is served" is not the condition worth waiting for: the wheel
            # is indexed before the sdist, and the digest cross-check below would then
            # compare one artifact and pass having verified half a release. Wait until
            # the release's own JSON document lists both package types.
            for attempt in $(seq 1 "$PYPI_WAIT_ATTEMPTS"); do
              if curl -fsSL "https://pypi.org/pypi/keel-workflow/${version}/json" -o "$meta" \
                && [ "$(jq -r '[.urls[].packagetype] | unique | join(",")' "$meta")" = "bdist_wheel,sdist" ]; then
                echo "both distributions listed on attempt ${attempt}"
                break
              fi
              if [ "$attempt" -eq "$PYPI_WAIT_ATTEMPTS" ]; then
                echo "::error title=PyPI never served both distributions::${req} did not have a wheel and an sdist on the index within the bounded wait"
                exit 1
              fi
              sleep "$PYPI_WAIT_SECONDS"
            done
            jq -r '.urls[] | "  \(.packagetype)  \(.filename)  uploaded \(.upload_time_iso_8601)"' "$meta"

            echo "== the published artifacts, against PyPI's own digests =="
            # PyPI is the primary record. `digests.sha256` is what the index computed
            # over the bytes it stores and will serve forever, and `skip-existing:
            # true` means no later run can change them. That is a stronger guarantee
            # than "the build reproduces": the build job pins SOURCE_DATE_EPOCH,
            # normalizes the sdist envelope and proves both artifacts rebuild
            # identically, but this comparison holds even if some future toolchain
            # change breaks that, because it never compares against a rebuild.
            #
            # Fetched from the document's own urls[] rather than resolved by pip:
            # `pip download --no-binary=:all:` prepares the sdist's metadata, pulling
            # an unpinned setuptools into an isolated build env to learn a filename
            # this document already states.
            checked=0
            while read -r name url want; do
              curl -fsSL "$url" -o "${pypi}/${name}"
              got="$(sha256sum "${pypi}/${name}" | cut -d" " -f1)"
              echo "${name}"
              echo "  pypi declares: ${want}"
              echo "  bytes hash to: ${got}"
              if [ "$want" != "$got" ]; then
                echo "::error title=Corrupt artifact::${name} does not hash to the digest PyPI declares for it"
                exit 1
              fi
              checked=$((checked + 1))
            done < <(jq -r '.urls[] | "\(.filename) \(.url) \(.digests.sha256)"' "$meta")
            # Always two. Zero would mean the loop compared nothing and the step
            # passed for that reason.
            if [ "$checked" -ne 2 ]; then
              echo "::error title=Nothing compared::expected 2 artifacts, hashed ${checked}"
              exit 1
            fi

            echo "== clean venv: install, keel version =="
            python -m venv "${RUNNER_TEMP}/verify-venv"
            "${RUNNER_TEMP}/verify-venv/bin/pip" install --disable-pip-version-check "$req"
            installed="$("${RUNNER_TEMP}/verify-venv/bin/keel" version)"
            echo "keel version -> ${installed}"
            # The tag is the claim; this is the package's answer to it. A wheel built
            # from the wrong commit installs and runs perfectly while reporting a
            # different version, which nothing else here would notice.
            if [ "$installed" != "keel ${version}" ]; then
              echo "::error title=Version mismatch::the package PyPI serves for ${TAG} reports '${installed}', not 'keel ${version}'"
              exit 1
            fi

            echo "== keel doctor (log-only: advisory by design, see below) =="
            # Deliberately not `--strict`. doctor's checks are advisory here: run
            # against a PyPI install from outside a keel checkout it correctly warns
            # that no adapter surfaces are present, which is not a release defect.
            # Its output is in the log for a human reading a failure, and it cannot
            # fail this job on its own.
            (cd "${RUNNER_TEMP}" && "${RUNNER_TEMP}/verify-venv/bin/keel" doctor)

            echo "== release_smoke.py against the published package =="
            python scripts/release_smoke.py --requirement "$req"

            echo "== secondary: the GitHub Release SHA256SUMS =="
            # Secondary, and tolerant of exactly one history. Both sides now refuse to
            # replace a published file — PyPI via `skip-existing`, the release upload
            # via `overwrite_files: false` — so these must agree. A release cut before
            # those settings could have had SHA256SUMS overwritten by a re-run that
            # rebuilt the artifacts. That is a defect in the release's bookkeeping,
            # not evidence that the package PyPI serves is wrong (PyPI's own digests
            # matched above), so it warns instead of failing.
            #
            # The discriminator is the asset's own createdAt vs updatedAt, NOT its
            # age relative to the PyPI upload. Measured on the healthy v1.19.3
            # release: PyPI uploaded at 07:28:47 and the release assets at 07:28:58,
            # so "the asset is newer than the PyPI upload" is true of *every* normal
            # release — a rule keyed on that would downgrade every genuine mismatch
            # to a warning, which is worse than the bug it was meant to fix. GitHub
            # bumps updatedAt only when an asset is *replaced*; on a first upload the
            # two timestamps are equal, so this asks the exact question.
            gh release download "$TAG" --pattern SHA256SUMS --dir "${RUNNER_TEMP}/ghrel" --clobber
            cat "${RUNNER_TEMP}/ghrel/SHA256SUMS"
            sums="$(gh release view "$TAG" --json assets \
              --jq '.assets[] | select(.name == "SHA256SUMS") | "\(.createdAt) \(.updatedAt)"')"
            sums_created="$(date -u -d "$(echo "$sums" | cut -d" " -f1)" +%s)"
            sums_updated="$(date -u -d "$(echo "$sums" | cut -d" " -f2)" +%s)"
            replaced=0
            if [ "$sums_updated" -gt "$sums_created" ]; then
              replaced=1
            fi
            echo "SHA256SUMS uploaded ${sums% *}, last updated ${sums#* } (replaced: ${replaced})"
            for artifact in "$pypi"/*; do
              name="$(basename "$artifact")"
              want="$(awk -v n="$name" '$2 == n { print $1 }' "${RUNNER_TEMP}/ghrel/SHA256SUMS")"
              got="$(sha256sum "$artifact" | cut -d" " -f1)"
              echo "${name}"
              echo "  release: ${want:-<absent>}"
              echo "  pypi:    ${got}"
              if [ -z "$want" ]; then
                echo "::error title=Not in SHA256SUMS::${name} is on PyPI but the release lists no digest for it"
                exit 1
              fi
              if [ "$want" = "$got" ]; then
                continue
              fi
              if [ "$replaced" -eq 1 ]; then
                echo "::warning title=SHA256SUMS was replaced after its first upload::${name} differs, and this release's checksum file was overwritten after it was first published — a re-run that rebuilt the artifacts. PyPI's own digest matched, so the package is intact; it is the release's checksum file that describes something else."
                continue
              fi
              echo "::error title=Digest mismatch::${name} on PyPI is not the artifact this release published"
              exit 1
            done
            echo "== verified ${req} =="
          } 2>&1 | tee "$LOG"

      - name: Open or update the release-broken issue
        if: failure()
        # A red job in a workflow nobody opens after a green publish is the same
        # notice-nobody-acts-on that left the tap failing for a day (#981). A
        # broken release gets a thing on a list instead, deduped by title so a
        # re-run comments rather than filing a second one.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="release-broken: ${TAG}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # This tail goes verbatim into a public issue. The verify step above
          # carries the constraint that nothing secret may reach $LOG, and nothing
          # there writes one. Masking token shapes anyway: the runner redacts
          # registered secrets in its own log but not inside a file it is asked to
          # read back, and a future edit to that step should not be one careless
          # `echo` away from publishing a credential. (There is no repo-wide
          # redaction helper for workflows — `src/keel/redaction.py` is the capture
          # artifact policy, a different surface with a different contract.)
          logtail="$(tail -n 100 "$LOG" 2>/dev/null || echo '(no log captured)')"
          logtail="$(printf '%s\n' "$logtail" \
            | sed -E 's/(gh[pousr]|github_pat)_[A-Za-z0-9_]{20,}/***redacted***/g')"

          body="$(printf '%s\n\n%s\n\n%s\n\n```\n%s\n```\n' \
            "Post-publish verification failed for \`${TAG}\`. PyPI files are immutable: fix forward with a new version, and yank ${TAG} if the published artifact is wrong (docs/keel/release.md, Rollback And Re-Run Notes)." \
            "Run: ${run_url}" \
            "Last 100 lines of the verify log (token shapes masked):" \
            "$logtail")"

          existing="$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "commented on #${existing}"
          else
            # Labels are best effort: a missing label must not swallow the report.
            gh issue create --title "$title" --body "$body" \
              --label "type:bug" --label "priority:high" --label "role:core" \
              || gh issue create --title "$title" --body "$body"
          fi

  tap-status:
    # What is left of the old `publish-formula` job. It used to download the tag
    # archive, rewrite Formula/keel.rb, push a branch, open a pull request and arm
    # auto-merge on it — five mechanisms for one unsatisfiable requirement, which
    # #1023 removed by rendering the formula in the publish job above and
    # attaching it to the release instead. Nothing here writes anything, in this
    # repository or any other: `contents: read`, no token, no `gh`.
    #
    # It reports where the tap stands so the release log answers "will `brew
    # upgrade` see this?" without anyone opening a second repository. It cannot
    # fail the release: the tap pulls on a 30-minute schedule, so being briefly
    # behind is the design rather than a defect, and the render step already
    # refused to attach a formula that does not hash to the archive it names.
    name: Report where the Homebrew tap stands
    needs: build-n-publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Compare the tap with this tag
        run: |
          set -euo pipefail
          tap="berkayturanci/homebrew-keel"
          # The contents API, not raw.githubusercontent.com: `raw` is CDN-cached
          # for minutes, so right after a sync it serves the previous formula and
          # this step would report a tap that is already current as behind.
          if ! curl -fsSL -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${tap}/contents/Formula/keel.rb" \
              -o "${RUNNER_TEMP}/tap-keel.rb"; then
            echo "::notice::could not read ${tap}; it syncs on its own schedule"
            exit 0
          fi
          serving="$(grep -m1 -oE '/tags/v[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' "${RUNNER_TEMP}/tap-keel.rb" || true)"
          echo "tap serves: ${serving:-<no tag url found>}"
          echo "this tag:   /tags/${GITHUB_REF_NAME}.tar.gz"
          if [ "$serving" = "/tags/${GITHUB_REF_NAME}.tar.gz" ]; then
            echo "the tap is already serving this release"
            exit 0
          fi
          echo "::notice::the tap is behind; its scheduled sync pulls this release's keel.rb asset within ~30 minutes."
          echo "To publish immediately: gh workflow run sync-formula.yml --repo ${tap}"
