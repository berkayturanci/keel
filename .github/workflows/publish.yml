name: Publish to PyPI and GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Least-privilege default for the whole workflow; the job below elevates only the
# scopes it needs (OpenSSF Scorecard TokenPermissions).
permissions:
  contents: read

jobs:
  build-n-publish:
    name: Build, Publish, and Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # PyPI trusted publishing (OIDC) + provenance attestation
      contents: write       # create the GitHub Release and upload assets
      attestations: write   # build-provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r .github/requirements/publish-tools.txt

      - name: Build package distributions
        run: python -m build --no-isolation --sdist --wheel --outdir dist/

      # CycloneDX software bill of materials for the built package. Written into
      # release/ (NOT dist/) so the PyPI upload sees only the wheel + sdist —
      # twine rejects non-distribution files in the upload dir. The SBOM still
      # ships with the GitHub Release.
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install --no-deps dist/*.whl
          mkdir -p release
          cyclonedx-py environment --output-format JSON --output-file release/sbom.cdx.json

      # A single SHA256SUMS over every release artifact so downloaders can verify
      # integrity with `sha256sum -c SHA256SUMS`. Staged in release/ next to the
      # dists (kept out of dist/ for the same reason as above).
      - name: Generate checksums
        run: |
          cp dist/*.whl dist/*.tar.gz release/
          cd release
          sha256sum *.whl *.tar.gz sbom.cdx.json > SHA256SUMS
          cat SHA256SUMS

      # Cryptographic attestation binding the artifacts to this workflow run,
      # verifiable with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      # TestPyPI trusted publishing: OIDC, no long-lived API token. Manual dispatch is
      # the rehearsal path; configure TestPyPI for this repo + workflow before use.
      - name: Publish package to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      # PyPI trusted publishing: OIDC, no long-lived API token. dist/ holds only
      # the wheel + sdist (SBOM/checksums live in release/). NOT continue-on-error:
      # a failed publish must fail the release loudly. `skip-existing` keeps re-runs
      # idempotent. Requires a one-time trusted-publisher config on PyPI for this
      # repo + workflow.
      - name: Publish package to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true

      - name: Create GitHub Release and Upload Packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: |
            release/*.whl
            release/*.tar.gz
            release/sbom.cdx.json
            release/SHA256SUMS
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-formula:
    # This repo is the source of truth for Formula/keel.rb (#774). The tap holds
    # the copy `brew install` actually runs, and until now the two were kept equal
    # by hand — which is how #787 shipped: the formula was fixed here, the guard
    # checked the copy here, and users kept installing the broken one from the tap
    # until it was synced manually.
    #
    # Copy, not construct. Everything interesting about this file is already
    # asserted on every push by test_release_docs.py; a release step that built
    # the formula would move those checks into the one phase that runs once per
    # tag, which is the phase where mistakes are least observed (#779).
    name: Sync the formula to the Homebrew tap
    needs: build-n-publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Push Formula/keel.rb to the tap
        # GITHUB_TOKEN cannot write to another repository, so this needs a PAT
        # with `contents: write` on the tap, stored as HOMEBREW_TAP_TOKEN. Without
        # it the step fails loudly rather than skipping: a release that silently
        # leaves the tap behind is the failure this job exists to prevent.
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: berkayturanci/homebrew-keel
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set; the tap would be left at the previous release."
            exit 1
          fi
          gh api "repos/${TAP}/contents/Formula/keel.rb" --jq .sha > .tap-sha || echo "" > .tap-sha
          gh api -X PUT "repos/${TAP}/contents/Formula/keel.rb" \
            -f message="chore: sync formula for ${GITHUB_REF_NAME} (from ${GITHUB_REPOSITORY}@${GITHUB_SHA})" \
            -f content="$(base64 -w0 Formula/keel.rb)" \
            $( [ -s .tap-sha ] && echo -f sha="$(cat .tap-sha)" )
      - name: Verify the tap now matches this repo
        # The push reporting success is not proof the tap serves the new bytes.
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: berkayturanci/homebrew-keel
        run: |
          set -euo pipefail
          gh api "repos/${TAP}/contents/Formula/keel.rb" --jq .content | base64 -d > tap-keel.rb
          diff Formula/keel.rb tap-keel.rb
