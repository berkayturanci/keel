name: Publish to PyPI and GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Least-privilege default for the whole workflow; the job below elevates only the
# scopes it needs (OpenSSF Scorecard TokenPermissions).
permissions:
  contents: read

jobs:
  build-n-publish:
    name: Build, Publish, and Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # PyPI trusted publishing (OIDC) + provenance attestation
      contents: write       # create the GitHub Release and upload assets
      attestations: write   # build-provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r .github/requirements/publish-tools.txt

      - name: Build package distributions
        run: python -m build --no-isolation --sdist --wheel --outdir dist/

      # CycloneDX software bill of materials for the built package. Written into
      # release/ (NOT dist/) so the PyPI upload sees only the wheel + sdist —
      # twine rejects non-distribution files in the upload dir. The SBOM still
      # ships with the GitHub Release.
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install --no-deps dist/*.whl
          mkdir -p release
          cyclonedx-py environment --output-format JSON --output-file release/sbom.cdx.json

      # A single SHA256SUMS over every release artifact so downloaders can verify
      # integrity with `sha256sum -c SHA256SUMS`. Staged in release/ next to the
      # dists (kept out of dist/ for the same reason as above).
      - name: Generate checksums
        run: |
          cp dist/*.whl dist/*.tar.gz release/
          cd release
          sha256sum *.whl *.tar.gz sbom.cdx.json > SHA256SUMS
          cat SHA256SUMS

      # Cryptographic attestation binding the artifacts to this workflow run,
      # verifiable with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      # TestPyPI trusted publishing: OIDC, no long-lived API token. Manual dispatch is
      # the rehearsal path; configure TestPyPI for this repo + workflow before use.
      - name: Publish package to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      # PyPI trusted publishing: OIDC, no long-lived API token. dist/ holds only
      # the wheel + sdist (SBOM/checksums live in release/). NOT continue-on-error:
      # a failed publish must fail the release loudly. `skip-existing` keeps re-runs
      # idempotent. Requires a one-time trusted-publisher config on PyPI for this
      # repo + workflow.
      - name: Publish package to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true

      - name: Create GitHub Release and Upload Packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: |
            release/*.whl
            release/*.tar.gz
            release/sbom.cdx.json
            release/SHA256SUMS
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-formula:
    # This repo is the source of truth for Formula/keel.rb (#774). The tap holds
    # the copy `brew install` actually runs, and they were once kept equal by hand
    # — which is how #787 shipped: the formula was fixed here, the guard checked
    # the copy here, and users kept installing the broken one until someone synced
    # the tap manually. The tap now pulls on a schedule, so this job's remaining
    # job is to refuse to release a formula that could not install.
    #
    # Copy, not construct. Everything interesting about this file is already
    # asserted on every push by test_release_docs.py; a release step that built
    # the formula would move those checks into the one phase that runs once per
    # tag, which is the phase where mistakes are least observed (#779).
    name: Sync the formula to the Homebrew tap
    needs: build-n-publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check the formula's checksum against the tag it points at
        # The url is bumped before the tag exists, so the sha256 cannot be right
        # at that moment — it can only be computed from the tarball GitHub builds
        # from the tag. Nothing closed that gap, and 1.16.0 shipped carrying
        # 1.15.0's checksum: `brew install` downloaded the new tarball, compared
        # it to the old digest and refused (#805).
        #
        # Fail here rather than publish. A tap holding a formula that cannot
        # install is worse than a tap one release behind — the stale one still
        # works.
        run: |
          set -euo pipefail
          url=$(grep -m1 -oE 'https://github.com/[^"]+\.tar\.gz' Formula/keel.rb)
          want=$(grep -m1 -oE '^  sha256 "[0-9a-f]{64}"' Formula/keel.rb | grep -oE '[0-9a-f]{64}')
          curl -fsSL "$url" -o /tmp/formula-src.tar.gz
          got=$(sha256sum /tmp/formula-src.tar.gz | cut -d' ' -f1)
          echo "url:  $url"
          echo "want: $want"
          echo "got:  $got"
          if [ "$want" != "$got" ]; then
            echo "::error::Formula/keel.rb sha256 does not match the tarball it points at; brew install would refuse."
            exit 1
          fi

      - name: Confirm the tap will pick this up
        # No push from here, and no token. GITHUB_TOKEN is scoped to this repo, so
        # writing the tap needed a PAT with `contents: write` on it — one repo
        # holding write access to another, to create, store and rotate.
        #
        # The tap pulls instead: berkayturanci/homebrew-keel runs a scheduled
        # workflow that fetches this formula, resolves its url, re-hashes the
        # artifact, and commits when they differ. Reading a public repo needs no
        # credential, and the token that writes the tap is the tap's own.
        #
        # This step only reports where the tap currently stands, so the release
        # log says whether it is already current or will catch up shortly. It
        # cannot fail the release: a tap a few minutes behind still installs, and
        # the step above already refused to release a formula that does not hash
        # to its own tarball.
        run: |
          set -euo pipefail
          curl -fsSL -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/berkayturanci/homebrew-keel/contents/Formula/keel.rb" \
            -o /tmp/tap-keel.rb || { echo "::notice::could not read the tap; it syncs on its own schedule"; exit 0; }
          if diff -q Formula/keel.rb /tmp/tap-keel.rb >/dev/null; then
            echo "tap is already serving this formula"
          else
            echo "::notice::tap is behind; its scheduled sync will pick this up within ~30 minutes."
            echo "To publish immediately: gh workflow run 'Sync formula from keel' --repo berkayturanci/homebrew-keel"
          fi
