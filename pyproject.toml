[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keel-workflow"
version = "1.5.0"
description = "Project-neutral, multi-agent workflow core: a fixed backbone of steps that drives an issue from backlog to done, customised per project via config + add-only Lego extensions."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Berkay Turancı", email = "berkayturanci@gmail.com" }]
maintainers = [{ name = "Berkay Turancı", email = "berkayturanci@gmail.com" }]
keywords = ["workflow", "automation", "ci", "agents", "code-review", "github", "merge-queue"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6",
    # Windows ships no system zoneinfo database; the stdlib `zoneinfo` used by the
    # merge-window logic needs the IANA data from this pure-data package there. It is
    # never installed on Linux/macOS, so the "one runtime dependency" rule still holds
    # on those platforms. See AGENTS.md (Stdlib-first).
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://berkayturanci.github.io/keel/"
Repository = "https://github.com/berkayturanci/keel"
Issues = "https://github.com/berkayturanci/keel/issues"
Changelog = "https://github.com/berkayturanci/keel/blob/main/CHANGELOG.md"
Documentation = "https://github.com/berkayturanci/keel/tree/main/docs/keel"

[project.optional-dependencies]
dev = [
    "ruff",
    "coverage",
]

[project.scripts]
keel = "keel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keel = ["schema/*.json", "adapters/commands/*.md"]

[tool.coverage.run]
branch = true
source = ["keel"]
omit = ["src/keel/__main__.py"]

[tool.coverage.report]
# keel keeps a high bar — the pure core stays fully covered (line + branch).
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
