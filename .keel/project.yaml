# keel project config — keel itself (Python; dogfoods its own backbone)
extends: keel
core_version: "^1.0"
owner: berkayturanci
repo: keel
base_branch: main
platform: python
timezone: Europe/Istanbul
merge_window: "07:00-01:30"

knobs:
  implementer_agents:
    core: backend-developer
  build_gate_cmd: "make test"
  lint_cmd: "make lint"
  # Tier-3 is for changes that can reach past CI — publish, deploy, write to the
  # repo, or land on a user's machine. `.github/workflows/**` used to be here
  # wholesale, which tiered up four PRs in one session that could not reach a
  # user (a workflow comment, two added CI jobs, and a change that pinned four
  # action refs *more tightly*) while leaving the formula `brew install` actually
  # runs at tier-2. Split by what a change can reach; see #786.
  #
  # The line is drawn on write permissions and non-default secrets, not on the
  # directory. Read off the workflows themselves rather than assumed:
  #   publish*.yml      attestations, contents, id-token: write
  #   pages.yml         pages, id-token: write
  #   keel-ship.yml     issues, pull-requests: write
  #   codeql.yml        security-events: write
  #   scorecard.yml     id-token: write + SCORECARD_TOKEN
  #   ci.yml            no write anywhere, GITHUB_TOKEN only   -> tier-2
  #   pr-lint.yml       no write anywhere, no secrets          -> tier-2
  # test_tier_policy.py enforces that criterion, so a new privileged workflow
  # fails rather than quietly landing at tier-2 because nobody updated this list.
  #
  # This is a static list and it will drift as workflows are added. That drift is
  # at least visible in a diff, unlike the waivers it replaces. Keying the tier on
  # the diff instead of the path is the real fix and is tracked separately.
  tier3_globs:
    - "src/keel/orchestrator.py"
    - "src/keel/config.py"
    - "src/keel/extensions.py"
    - ".github/workflows/publish*.yml"
    - ".github/workflows/pages.yml"
    - ".github/workflows/keel-ship.yml"
    - ".github/workflows/codeql.yml"
    - ".github/workflows/scorecard.yml"
    # Not workflows, but they reach further than most code here does: this is the
    # formula `brew install` runs, and the hash-locked tooling that publishes to
    # PyPI. Both were tier-2 while every CI edit was tier-3 (#787, #779).
    - "Formula/keel.rb"
    - ".github/requirements/**"
  ci_workflows:
    "CI": "**"
  docs_gate_paths: ["docs/**", "*.md", "README.md"]
  sot_doc: AGENTS.md

gates: [build, lint]

extensions: {}
extensions_dir: .keel/extensions

policy_pack:
  name: keel-python
  presets: ["bandit"]
  labels:
    status: ["status:backlog", "status:in-progress", "status:needs-review", "status:done"]
    priority: ["priority:high", "priority:medium", "priority:low"]
    role: ["core"]
  status_transitions:
    start: "status:in-progress"
    review: "status:needs-review"
    done: "status:done"
  risk_rules:
    - id: core-contract
      paths: ["src/keel/config.py", "src/keel/schema/project.schema.json", "src/keel/model.py"]
      required_gates: ["build", "lint"]
      review_additions: ["Check schema compatibility and config-hash determinism."]
      docs_required: true
  test_groups:
    unit:
      command: "make test"
      paths: ["src/**", "tests/**"]
      required_capabilities: ["shell"]
    package-validate:
      command: "make validate"
      paths: ["projects/**", "src/keel/schema/**"]
      required_capabilities: ["shell"]
  docs:
    required_paths: ["docs/keel/**", "README.md"]
    allow_none_reasons: ["No user-facing behavior or config contract changed."]
    impact_required: true
  health_providers:
    ci:
      kind: github-checks
      optional_capabilities: ["gh", "github-mcp"]
  scan:
    areas:
      core: ["src/keel/**"]
      tests: ["tests/**"]
      docs: ["docs/**", "README.md"]
      workflows: [".github/workflows/**"]
    active_branch_patterns: ["feat/**", "fix/**", "chore/**", "docs/**"]
    issue_labels:
      regression: ["type:bug", "source:regression-scan"]
      review-all-day: ["type:bug", "source:review-all-day"]
    near_text_similarity: 0.6
    batch_threshold: 5
    large_diff_max_bytes: 200000
  command_routing:
    implement:
      agent_role: core
      paths: ["src/**", "tests/**", "docs/**"]
      required_capabilities: ["shell", "git"]
      side_effects: ["file_edit", "git_commit"]
      dry_run_safe: false
  workflow_policies:
    pr-loop:
      posting_mode: summary
      posting_owner: orchestrator
      reviewer_isolation:
        shared_with_ship: true
        codename_prefix: PR-LOOP
        no_cross_reading: true
      inputs:
        auto_detect_current_branch: true
        explicit_pr_targets: true
        reads_review_comments: true
        reads_issue_conversation_comments: true
      ci:
        recheck_after_push: true
        green_required_to_exit: true
        degrade_when_logs_unavailable: true
      fix_loop:
        budget: 3
        self_review_before_push: true
        reviewer_fanout_after_each_push: true
      completion:
        marker: null
        merge: handoff
        summary_comment: true
    review-cycle:
      posting_mode: inline
      posting_owner: orchestrator
      reviewer_isolation:
        shared_with_ship: true
        codename_prefix: REVIEW-CYCLE
        no_cross_reading: true
      inputs:
        multi_pr: true
        sequential_pr_processing: true
      review:
        parallel_reviewers_within_pr: true
        partial_reviewer_failures_degrade: true
        severity_histogram_source_of_truth: true
      fix_loop:
        budget: 3
        enabled: true
      completion:
        marker: review-cycle-complete
        marker_after_summary: true
        merge: never
        formal_approval: never
  reports:
    session: "docs/session-reports/"
  review:
    additions: ["Reject consumer-specific policy in packaged command bodies."]
    required_sections: ["Testing", "Docs Impact"]
