# keel project config — example-flutter (Flutter + Supabase, default branch main)
# No Android/Kotlin/Realm/gradle here by construction — those would be foreign leaks.
extends: keel
core_version: "^1.0"
owner: berkayturanci
repo: example-flutter
base_branch: main
platform: flutter-supabase
timezone: Europe/Istanbul
merge_window: "07:00-01:30"

knobs:
  implementer_agents:
    mobile: flutter-developer
    backend: supabase-developer
  build_gate_cmd: "cd apps/mobile && flutter test 2>&1 | tail -50"
  lint_cmd: "cd apps/mobile && flutter analyze 2>&1 | tail -30"
  tier3_globs:
    - "supabase/migrations/**"
    - "supabase/functions/**"
    - "apps/mobile/lib/**/*.dart"
    - ".github/workflows/**"
  ci_workflows:
    "Flutter CI": "apps/mobile/**"
    "Supabase CI": "supabase/**"
  docs_gate_paths: ["docs/**", "*.md"]
  sot_doc: AGENTS.md

# gates: = built-in gates only (build/lint/jury). Project gates (design-parity)
# come in via the extension slots below.
gates: [build, lint]

extensions:
  tester: [design-parity.md]            # example-flutter's "design-equality" test Lego
  pre-merge: [design-parity-gate.md]    # no merge unless design-parity passes
extensions_dir: .keel/extensions

policy_pack:
  name: example-flutter-supabase
  labels:
    status: ["status:backlog", "status:in-progress", "status:needs-review", "status:done"]
    priority: ["priority:high", "priority:medium", "priority:low"]
    role: ["mobile", "backend"]
  status_transitions:
    start: "status:in-progress"
    review: "status:needs-review"
    done: "status:done"
  risk_rules:
    - id: database-migration
      paths: ["supabase/migrations/**"]
      required_gates: ["build", "lint"]
      review_additions: ["Check migration rollback and seed-data compatibility."]
      docs_required: true
  test_groups:
    mobile:
      command: "cd apps/mobile && flutter test"
      paths: ["apps/mobile/**"]
      required_capabilities: ["shell"]
    backend:
      command: "cd supabase && supabase test"
      paths: ["supabase/**"]
      required_capabilities: ["shell"]
  docs:
    required_paths: ["docs/**"]
    allow_none_reasons: ["Internal-only refactor with no operator-facing behavior change."]
    impact_required: true
  health_providers:
    release:
      kind: project-command
      command: ".keel/health/release-summary"
      optional_capabilities: ["shell"]
  scan:
    areas:
      mobile: ["apps/mobile/**"]
      backend: ["supabase/**"]
      workflows: [".github/workflows/**"]
    active_branch_patterns: ["feature/**", "fix/**", "chore/**"]
    issue_labels:
      regression: ["type:bug", "source:regression-scan"]
      review-all-day: ["type:bug", "source:review-all-day"]
    near_text_similarity: 0.6
    batch_threshold: 5
    large_diff_max_bytes: 200000
  command_routing:
    ui-smoke:
      agent_role: mobile
      paths: ["apps/mobile/**"]
      required_capabilities: ["shell"]
      side_effects: ["report_write"]
      dry_run_safe: true
  reports:
    morning: "reports/morning/"
    session: "reports/session/"
    overnight: "reports/overnight/"
    deferrals: "reports/deferrals.md"
  review:
    additions: ["Check design-parity extension evidence for user-visible changes."]
    required_sections: ["Testing", "Docs Impact"]
