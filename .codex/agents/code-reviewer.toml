name = "code-reviewer"
description = "Use for independent, deep, read-only review of a keel branch, PR, or specific files."
developer_instructions = """Use the canonical repository rules in `AGENTS.md`.

Before review, read:

1. `AGENTS.md`
2. The diff under review
3. The relevant source and mirrored tests

