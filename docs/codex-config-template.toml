# Codex CLI global config additions
# Add these keys to `~/.codex/config.toml` if they are not already present.
#
# approval = "never"  — auto-approve all model-generated commands
# sandbox  = "workspace-write" — PRIMARY security boundary (filesystem-level, verified)
#
# block_commands — UNVERIFIED key (tested 2026-05-25): Codex silently ignored it;
#   the sandbox blocked dangerous ops at the filesystem level instead.
#   The real deny enforcement comes from the project's .codex/hooks.json PreToolUse
#   hook and its repo-local deny script.
#   Keep this block as a best-effort declaration; do not rely on it as the sole guard.
#
# Project-specific deploy/delete commands belong in the downstream project's local deny
# list. Keep this template limited to generally destructive operations.

approval = "never"
sandbox  = "workspace-write"

block_commands = [
  "git push --force",
  "git push -f ",
  "git push --force-with-lease",
  "git push origin :",
  "git push origin --delete",
  "git push --delete",
  "git reset --hard",
  "git clean -fdx",
  "git filter-branch",
  "git branch -D develop",
  "git branch -D main",
  "rm -rf /",
  "rm -rf ~",
  "rm -rf $HOME",
  "rm -rf --no-preserve-root",
  "sudo rm",
  # The trailing space is intentional: it prefix-matches all "sudo <anything>" invocations.
  "sudo ",
  "gh repo delete",
  "gh release delete",
  "gh secret delete",
  "gh secret set",
  "gh auth logout",
  "npm publish",
  "npm unpublish",
  "curl | sh",
  "curl | bash",
  "wget | sh",
  "wget | bash",
  "eval ",
  "dd if=",
  "mkfs",
  "shred",
  "chmod -R 777 /",
  "chown -R "
]
