<svg xmlns="http://www.w3.org/2000/svg" width="704" height="526" viewBox="0 0 704 526" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">keel stops a change, then clears it</title>
<desc id="desc">A terminal recording: keel run-gates fails a change whose test breaks and prints BLOCKED, the fix is shown with git diff, and the same command then passes. Generated by scripts/record_demo.py from real output.</desc>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13px;fill:#e6edf3;white-space:pre}.n{fill:#8b949e}.g{fill:#3fb950}.r{fill:#f85149}.a{fill:#d29922}.c{fill:#39c5cf}.b{font-weight:700}.l,.k{animation-duration:28.1s;animation-iteration-count:infinite;animation-timing-function:linear}.l{opacity:0}.t0{animation-name:v0}@keyframes v0{0%,1.423%{opacity:0}1.459%,97.865%{opacity:1}100%{opacity:0}}.t1{animation-name:v1}@keyframes v1{0%,7.829%{opacity:0}7.865%,97.865%{opacity:1}100%{opacity:0}}.t2{animation-name:v2}@keyframes v2{0%,15.658%{opacity:0}15.694%,97.865%{opacity:1}100%{opacity:0}}.t3{animation-name:v3}@keyframes v3{0%,15.801%{opacity:0}15.836%,97.865%{opacity:1}100%{opacity:0}}.t4{animation-name:v4}@keyframes v4{0%,23.63%{opacity:0}23.665%,97.865%{opacity:1}100%{opacity:0}}.t5{animation-name:v5}@keyframes v5{0%,31.637%{opacity:0}31.673%,97.865%{opacity:1}100%{opacity:0}}.t6{animation-name:v6}@keyframes v6{0%,31.779%{opacity:0}31.815%,97.865%{opacity:1}100%{opacity:0}}.t7{animation-name:v7}@keyframes v7{0%,31.922%{opacity:0}31.957%,97.865%{opacity:1}100%{opacity:0}}.t8{animation-name:v8}@keyframes v8{0%,32.064%{opacity:0}32.1%,97.865%{opacity:1}100%{opacity:0}}.t9{animation-name:v9}@keyframes v9{0%,32.206%{opacity:0}32.242%,97.865%{opacity:1}100%{opacity:0}}.t10{animation-name:v10}@keyframes v10{0%,45.018%{opacity:0}45.053%,97.865%{opacity:1}100%{opacity:0}}.t11{animation-name:v11}@keyframes v11{0%,51.423%{opacity:0}51.459%,97.865%{opacity:1}100%{opacity:0}}.t12{animation-name:v12}@keyframes v12{0%,54.982%{opacity:0}55.018%,97.865%{opacity:1}100%{opacity:0}}.t13{animation-name:v13}@keyframes v13{0%,55.125%{opacity:0}55.16%,97.865%{opacity:1}100%{opacity:0}}.t14{animation-name:v14}@keyframes v14{0%,55.267%{opacity:0}55.302%,97.865%{opacity:1}100%{opacity:0}}.t15{animation-name:v15}@keyframes v15{0%,55.409%{opacity:0}55.445%,97.865%{opacity:1}100%{opacity:0}}.t16{animation-name:v16}@keyframes v16{0%,55.552%{opacity:0}55.587%,97.865%{opacity:1}100%{opacity:0}}.t17{animation-name:v17}@keyframes v17{0%,55.694%{opacity:0}55.73%,97.865%{opacity:1}100%{opacity:0}}.t18{animation-name:v18}@keyframes v18{0%,55.836%{opacity:0}55.872%,97.865%{opacity:1}100%{opacity:0}}.t19{animation-name:v19}@keyframes v19{0%,55.979%{opacity:0}56.014%,97.865%{opacity:1}100%{opacity:0}}.t20{animation-name:v20}@keyframes v20{0%,56.121%{opacity:0}56.157%,97.865%{opacity:1}100%{opacity:0}}.t21{animation-name:v21}@keyframes v21{0%,63.95%{opacity:0}63.986%,97.865%{opacity:1}100%{opacity:0}}.t22{animation-name:v22}@keyframes v22{0%,71.957%{opacity:0}71.993%,97.865%{opacity:1}100%{opacity:0}}.t23{animation-name:v23}@keyframes v23{0%,72.1%{opacity:0}72.135%,97.865%{opacity:1}100%{opacity:0}}.t24{animation-name:v24}@keyframes v24{0%,72.242%{opacity:0}72.278%,97.865%{opacity:1}100%{opacity:0}}.t25{animation-name:v25}@keyframes v25{0%,80.071%{opacity:0}80.107%,97.865%{opacity:1}100%{opacity:0}}.k1{animation-name:k1}@keyframes k1{0%,7.829%{transform:translateX(0);animation-timing-function:steps(32,end)}13.523%,100%{transform:translateX(254.8px)}}.k4{animation-name:k4}@keyframes k4{0%,23.63%{transform:translateX(0);animation-timing-function:steps(33,end)}29.502%,100%{transform:translateX(262.7px)}}.k11{animation-name:k11}@keyframes k11{0%,51.423%{transform:translateX(0);animation-timing-function:steps(8,end)}52.847%,100%{transform:translateX(65.2px)}}.k21{animation-name:k21}@keyframes k21{0%,63.95%{transform:translateX(0);animation-timing-function:steps(33,end)}69.822%,100%{transform:translateX(262.7px)}}@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}.k{animation:none;display:none}}</style>
<defs><clipPath id="screen"><rect x="1" y="30" width="702" height="495"/></clipPath></defs>
<rect x="0.5" y="0.5" width="703" height="525" rx="8" fill="#0d1117" stroke="#30363d"/>
<path d="M1 30V9a8 8 0 0 1 8-8h686a8 8 0 0 1 8 8V30z" fill="#161b22"/>
<circle cx="16" cy="15.0" r="5.5" fill="#30363d"/><circle cx="34" cy="15.0" r="5.5" fill="#30363d"/><circle cx="52" cy="15.0" r="5.5" fill="#30363d"/>
<text class="n" x="352" y="19.0" text-anchor="middle">~/calc</text>
<g clip-path="url(#screen)">
<text class="l t0" x="16" y="59"><tspan class="n"># a change to calc.py is waiting to merge</tspan></text>
<text class="l t1" x="16" y="77"><tspan class="g">$</tspan> keel validate .keel/project.yaml</text>
<rect class="k k1" x="31.8" y="64" width="254.8" height="18" fill="#0d1117"/>
<text class="l t2" x="16" y="95"><tspan class="g">OK</tspan>       .keel/project.yaml  (calc, base main)</text>
<text class="l t3" x="16" y="113"><tspan class="n">[exit 0]</tspan></text>
<text class="l t4" x="16" y="131"><tspan class="g">$</tspan> keel run-gates .keel/project.yaml</text>
<rect class="k k4" x="31.8" y="118" width="262.7" height="18" fill="#0d1117"/>
<text class="l t5" x="16" y="149">     <tspan class="r b">FAIL</tspan>  build</text>
<text class="l t6" x="16" y="167">       <tspan class="g">ok</tspan>  lint</text>
<text class="l t7" x="16" y="185">    <tspan class="a">[major]</tspan> build: build failed (exit 1): test_add: add(2, 3) returned -1, expected 5</text>
<text class="l t8" x="16" y="203"><tspan class="r b">BLOCKED</tspan> — merge is gated by the findings above</text>
<text class="l t9" x="16" y="221"><tspan class="n">[exit 1]</tspan></text>
<text class="l t10" x="16" y="239"><tspan class="n"># keel stopped it: the build gate failed. The fix:</tspan></text>
<text class="l t11" x="16" y="257"><tspan class="g">$</tspan> git diff</text>
<rect class="k k11" x="31.8" y="244" width="65.2" height="18" fill="#0d1117"/>
<text class="l t12" x="16" y="275"><tspan class="b">diff --git a/calc.py b/calc.py</tspan></text>
<text class="l t13" x="16" y="293"><tspan class="b">index 12ee743..4693ad3 100644</tspan></text>
<text class="l t14" x="16" y="311"><tspan class="b">--- a/calc.py</tspan></text>
<text class="l t15" x="16" y="329"><tspan class="b">+++ b/calc.py</tspan></text>
<text class="l t16" x="16" y="347"><tspan class="c">@@ -1,2 +1,2 @@</tspan></text>
<text class="l t17" x="16" y="365"> def add(a, b):</text>
<text class="l t18" x="16" y="383"><tspan class="r">-    return a - b</tspan></text>
<text class="l t19" x="16" y="401"><tspan class="g">+    return a + b</tspan></text>
<text class="l t20" x="16" y="419"><tspan class="n">[exit 0]</tspan></text>
<text class="l t21" x="16" y="437"><tspan class="g">$</tspan> keel run-gates .keel/project.yaml</text>
<rect class="k k21" x="31.8" y="424" width="262.7" height="18" fill="#0d1117"/>
<text class="l t22" x="16" y="455">       <tspan class="g">ok</tspan>  build</text>
<text class="l t23" x="16" y="473">       <tspan class="g">ok</tspan>  lint</text>
<text class="l t24" x="16" y="491"><tspan class="n">[exit 0]</tspan></text>
<text class="l t25" x="16" y="509"><tspan class="n"># cleared: the gates pass and no longer block the merge</tspan></text>
</g>
</svg>
