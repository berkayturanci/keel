<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="keel — drive every issue to merged">
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#f8fafc"></stop>
    </linearGradient>
    <linearGradient id="merged-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"></stop>
      <stop offset="100%" stop-color="#16a34a"></stop>
    </linearGradient>
    <radialGradient id="glow-teal-light" cx="0.85" cy="0.25" r="0.55">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.06"></stop>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="badge-glow-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.12"></stop>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.05"></stop>
    </linearGradient>
  </defs>

  <!-- Background Base & Micro Grid -->
  <rect width="1200" height="300" rx="24" fill="url(#bg-light)"></rect>
  <rect width="1200" height="300" rx="24" fill="url(#glow-teal-light)"></rect>
  <g stroke="#0d9488" stroke-opacity="0.04">
    <path d="M120 0v300M240 0v300M360 0v300M480 0v300M600 0v300M720 0v300M840 0v300M960 0v300M1080 0v300"></path>
    <path d="M0 60h1200M0 120h1200M0 180h1200M0 240h1200"></path>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#e2e8f0" stroke-width="1.8"></rect>

  <!-- Left: Keel Brand & Typography -->
  <g transform="translate(60, 46)">
    <!-- Anchor Icon Container -->
    <rect width="52" height="52" rx="12" fill="#f1f5f9"></rect>
    <rect x="0.6" y="0.6" width="50.8" height="50.8" rx="11.4" fill="none" stroke="#cbd5e1"></rect>
    
    <!-- Ship Backbone Symbol -->
    <line x1="12" y1="33" x2="26" y2="33" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"></line>
    <circle cx="12" cy="33" r="2.6" fill="#0d9488"></circle>
    <circle cx="19" cy="33" r="2.6" fill="#0284c7"></circle>
    <circle cx="26" cy="33" r="2.8" fill="#d97706"></circle>
    <path d="M26 33 Q35 27 41 15" stroke="#16a34a" stroke-width="4.2" fill="none" stroke-linecap="round"></path>
    <circle cx="41" cy="15" r="3.4" fill="#16a34a"></circle>
    
    <!-- Brand Titles -->
    <text x="68" y="30" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">keel</text>
    <text x="68" y="48" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#64748b">turn coding agents into work owners</text>
  </g>

  <!-- Slogan & Description -->
  <text x="60" y="160" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#0f172a" letter-spacing="-0.03em">Drive every issue to <tspan fill="url(#merged-light)">merged.</tspan></text>
  <text x="60" y="196" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16.5" fill="#475569">Universal workflow spine — any AI agent, multi-layer review, and commit-bound evidence.</text>

  <!-- Highlights Badge Strip -->
  <g transform="translate(60, 248)">
    <text font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#64748b">
      <tspan fill="#0d9488" font-weight="600">s0→s12 backbone</tspan>
      <tspan fill="#94a3b8"> · </tspan>
      <tspan fill="#1e293b" font-weight="600">All AI Agents &amp; Models</tspan>
      <tspan fill="#94a3b8"> · </tspan>
      <tspan fill="#b45309">Security Presets</tspan>
      <tspan fill="#94a3b8"> · </tspan>
      <tspan fill="#15803d" font-weight="600">100% covered</tspan>
      <tspan fill="#94a3b8"> · </tspan>
      <tspan fill="#64748b">Apache-2.0</tspan>
    </text>
  </g>

  <!-- Right: Iconic Upward Merge Curve Pipeline with Evidence Badge -->
  <g transform="translate(710, 0)">
    <!-- Top Evidence Locked Badge -->
    <g transform="translate(230, 44)">
      <rect width="170" height="26" rx="13" fill="url(#badge-glow-light)" stroke="#16a34a" stroke-opacity="0.35" stroke-width="1.2"></rect>
      <circle cx="16" cy="13" r="3.6" fill="#16a34a"></circle>
      <text x="96" y="17.5" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#15803d">evidence locked ✓</text>
    </g>

    <!-- Main Backbone Track Line (Horizontal s0 -> s10) -->
    <line x1="30" y1="165" x2="315" y2="165" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"></line>

    <!-- Upward Merge Branch Curve (s10 merge -> s12 destination) -->
    <path d="M 315 165 Q 355 152 380 95" stroke="#16a34a" stroke-width="5.5" fill="none" stroke-linecap="round"></path>
    <circle cx="380" cy="95" r="7.5" fill="#16a34a"></circle>
    <path d="M 376 95 L 379 98 L 385 91" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>

    <!-- s12 captured label placed to the right of node (Zero overlap!) -->
    <text x="396" y="93" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#16a34a">s12</text>
    <text x="396" y="107" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d">captured ✓</text>

    <!-- Node 1: s0 Intake -->
    <circle cx="30" cy="165" r="5" fill="#0d9488"></circle>
    <text x="30" y="192" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#475569">s0</text>
    <text x="30" y="206" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">intake</text>

    <!-- Node 2: s4 Implement -->
    <circle cx="100" cy="165" r="5" fill="#0284c7"></circle>
    <text x="100" y="192" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#0284c7">s4</text>
    <text x="100" y="206" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">implement</text>

    <!-- Node 3: s7 Review -->
    <circle cx="170" cy="165" r="5" fill="#9333ea"></circle>
    <text x="170" y="192" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#9333ea">s7</text>
    <text x="170" y="206" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">review</text>

    <!-- Node 4: s8 Gates -->
    <circle cx="240" cy="165" r="5" fill="#16a34a"></circle>
    <text x="240" y="192" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#16a34a">s8</text>
    <text x="240" y="206" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">gates</text>

    <!-- Node 5: s10 Merge Lock -->
    <circle cx="315" cy="165" r="6.5" fill="#d97706"></circle>
    <text x="315" y="192" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#d97706">s10</text>
    <text x="315" y="206" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#b45309">merge lock</text>
  </g>
</svg>