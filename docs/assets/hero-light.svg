<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="keel setup installs project config, Claude commands, and shared skills so every agent runs the same workflow backbone">
  <rect width="1200" height="430" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="429" rx="16" fill="none" stroke="#d0d7de"/>
  <text x="56" y="78" font-size="58" font-weight="700" fill="#1f2328">keel setup</text>
  <text x="56" y="116" font-size="21" fill="#656d76">One command installs the same project-neutral workflow for every coding agent.</text>
  <g transform="translate(56,160)">
    <rect width="250" height="118" rx="10" fill="#f6f8fa" stroke="#0969da"/>
    <text x="24" y="38" font-size="20" font-weight="700" fill="#1f2328">keel setup --root .</text>
    <text x="24" y="70" font-size="15" fill="#656d76">detect stack</text>
    <text x="24" y="94" font-size="15" fill="#656d76">validate + render plan</text>
  </g>
  <path d="M326 219 H394" stroke="#0969da" stroke-width="3" fill="none"/>
  <path d="M394 219 l-10 -7 v14 z" fill="#0969da"/>
  <g transform="translate(418,132)">
    <rect width="328" height="174" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="22" y="34" font-size="13" letter-spacing="1.4" fill="#656d76">GENERATED SURFACES</text>
    <g transform="translate(22,58)">
      <rect width="284" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <circle cx="18" cy="16" r="5" fill="#1a7f37"/>
      <text x="36" y="21" font-size="15" fill="#1f2328">.keel/project.yaml</text>
    </g>
    <g transform="translate(22,100)">
      <rect width="284" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <circle cx="18" cy="16" r="5" fill="#0969da"/>
      <text x="36" y="21" font-size="15" fill="#1f2328">.claude/commands/keel/*</text>
    </g>
    <g transform="translate(22,142)">
      <rect width="284" height="32" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <circle cx="18" cy="16" r="5" fill="#9a6700"/>
      <text x="36" y="21" font-size="15" fill="#1f2328">.agents/skills/keel-*</text>
    </g>
  </g>
  <path d="M766 219 H834" stroke="#0969da" stroke-width="3" fill="none"/>
  <path d="M834 219 l-10 -7 v14 z" fill="#0969da"/>
  <g transform="translate(858,132)">
    <rect width="286" height="174" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="22" y="34" font-size="13" letter-spacing="1.4" fill="#656d76">SAME BACKBONE</text>
    <text x="22" y="68" font-size="16" fill="#1f2328">Claude Code</text>
    <text x="22" y="96" font-size="16" fill="#1f2328">Codex</text>
    <text x="22" y="124" font-size="16" fill="#1f2328">Gemini</text>
    <text x="22" y="152" font-size="16" fill="#1f2328">Antigravity</text>
    <line x1="150" y1="110" x2="256" y2="110" stroke="#d0d7de" stroke-width="3"/>
    <circle cx="150" cy="110" r="6" fill="#0969da"/>
    <circle cx="185" cy="110" r="6" fill="#0969da"/>
    <circle cx="220" cy="110" r="6" fill="#0969da"/>
    <circle cx="256" cy="110" r="9" fill="#1a7f37"/>
    <text x="150" y="142" font-size="13" fill="#656d76">issue</text>
    <text x="256" y="142" font-size="13" fill="#656d76" text-anchor="end">merged</text>
  </g>
  <g transform="translate(56,348)">
    <text x="0" y="0" font-size="14" fill="#656d76">Projects keep policy in config and extensions. The packaged command bodies stay in keel.</text>
    <text x="0" y="30" font-size="14" fill="#656d76">Update later with: </text>
    <text x="124" y="30" font-size="14" fill="#1f2328">keel update-adapter all --root .</text>
  </g>
</svg>
