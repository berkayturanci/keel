<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · keel-visual</title>
<style>
  :root{
    --bg:#0a0e1a; --panel:#111728; --panel2:#0e1422; --line:#1d2740; --line2:#2a3756;
    --txt:#e7ecf7; --mut:#8ea0c6; --dim:#5b6b92;
    --idle:#2a3550; --info:#49b6ff; --warn:#f0a020; --minor:#e6c12e;
    --danger:#ff5468; --ok:#7ad14a; --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:26px;max-width:1280px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:#0c1118;border:1.5px solid var(--ok);box-shadow:0 0 16px rgba(122,209,74,.45);display:inline-flex;align-items:center;justify-content:center;overflow:hidden}
  .brand .mark svg{width:100%;height:100%;display:block}
  .count{margin-left:auto;font-size:13px;color:var(--mut)}
  .count b{color:var(--txt)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
  .chead{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .proj{font-weight:600;font-size:14px}
  .lab{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .badge{margin-left:auto;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
  .badge.done{background:rgba(122,209,74,.16);color:var(--ok)}
  .badge.active{background:rgba(73,182,255,.16);color:var(--info)}
  .badge.gate{background:rgba(240,160,32,.16);color:var(--warn)}
  .badge.blocked{background:rgba(255,84,104,.18);color:var(--danger)}
  .strip{display:flex;align-items:center;gap:0;margin:4px 0 11px}
  .dot{width:13px;height:13px;border-radius:50%;background:var(--idle);flex:none;border:2px solid transparent}
  .seg{height:2px;flex:1;background:var(--line2);min-width:4px}
  .dot.done{background:var(--ok)}
  .seg.done{background:var(--ok)}
  .dot.active{background:var(--info);box-shadow:0 0 0 4px rgba(73,182,255,.22);animation:pulse 1.3s ease-in-out infinite}
  .dot.gate{background:var(--warn);box-shadow:0 0 0 4px rgba(240,160,32,.22);animation:pulse 1.3s ease-in-out infinite}
  .dot.fail{background:var(--danger);box-shadow:0 0 0 4px rgba(255,84,104,.25)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .cfoot{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
  .cfoot .step{color:var(--txt);font-weight:600}
  .jury{margin-left:auto;font-size:11px;font-weight:600;color:var(--info);background:rgba(73,182,255,.12);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  .jury.gating{color:var(--warn);background:rgba(240,160,32,.12)}
  .empty{color:var(--dim);padding:40px;text-align:center;border:1px dashed var(--line2);border-radius:var(--r)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:16px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><line x1="12" y1="40" x2="32" y2="40" stroke="#2a3744" stroke-width="3" stroke-linecap="round"></line><circle cx="12" cy="40" r="3.2" fill="#6366f1"></circle><circle cx="20" cy="40" r="3.2" fill="#6366f1"></circle><circle cx="28" cy="40" r="3.2" fill="#6366f1"></circle><circle cx="32" cy="40" r="3.8" fill="#f5a524"></circle><path d="M32 40 Q44 34 52 19" stroke="#10b981" stroke-width="5.5" fill="none" stroke-linecap="round"></path><circle cx="52" cy="19" r="4.5" fill="#10b981"></circle></svg></span> keel-visual · board</div>
  <div class="count" id="count"></div>
</header>
<div id="grid" class="grid"></div>
<div class="legend">
  <span><i style="background:var(--ok)"></i>done / merged</span>
  <span><i style="background:var(--info)"></i>active</span>
  <span><i style="background:var(--warn)"></i>gate</span>
  <span><i style="background:var(--danger)"></i>blocked</span>
  <span><i style="background:var(--idle)"></i>not reached</span>
</div>

<script>window.KEEL_BOARD = __KEEL_BOARD__;</script>
<script>
(function(){
  const BOARD = Array.isArray(window.KEEL_BOARD) ? window.KEEL_BOARD : [];
  const grid = document.getElementById('grid');
  const nproj = new Set(BOARD.map(r => r.project || '')).size;
  document.getElementById('count').innerHTML =
    '<b>'+BOARD.length+'</b> run'+(BOARD.length===1?'':'s')+' across <b>'+nproj+'</b> project'+(nproj===1?'':'s');

  if(!BOARD.length){
    const e=document.createElement('div'); e.className='empty';
    e.textContent='no active runs found'; grid.appendChild(e); return;
  }

  function el(tag, cls){ const n=document.createElement(tag); if(cls) n.className=cls; return n; }
  const GATE_KINDS = {gate:1, merge:1};

  BOARD.forEach(run => {
    const steps = Array.isArray(run.steps) ? run.steps : [];
    const active = run.active_index|0;
    const merged = !!run.merged;
    const card = el('div','card');

    const head = el('div','chead');
    const proj = el('span','proj'); proj.textContent = run.project || '?';
    const lab = el('span','lab'); lab.textContent = run.label || '?';
    const badge = el('span','badge '+(run.status||'active'));
    badge.textContent = run.status || 'active';
    head.append(proj, lab, badge); card.appendChild(head);

    const strip = el('div','strip');
    steps.forEach((s, idx) => {
      if(idx>0){ const seg=el('span','seg'+((merged || idx<=active)?' done':'')); strip.appendChild(seg); }
      const dot = el('span','dot');
      const isGate = GATE_KINDS[s.kind];
      const failed = s.gate && s.gate.outcome === 'fail';
      if(merged && idx<=active) dot.classList.add('done');
      else if(idx < active) dot.classList.add('done');
      else if(idx === active){
        if(failed) dot.classList.add('fail');
        else if(isGate) dot.classList.add('gate');
        else dot.classList.add('active');
      }
      dot.title = (s.id||'')+' · '+(s.name||'');
      strip.appendChild(dot);
    });
    card.appendChild(strip);

    const foot = el('div','cfoot');
    const step = el('span','step'); step.textContent = (run.active_id||'?')+' · '+(run.active_name||'?');
    foot.appendChild(step);
    const cmd = el('span'); cmd.textContent = run.command || 'ship'; foot.appendChild(cmd);
    const jury = run.jury || {};
    if(jury.active){
      const j = el('span','jury'+(jury.mode==='gating'?' gating':''));
      j.textContent = 'jury · '+(jury.mode||'on'); foot.appendChild(j);
    }
    card.appendChild(foot);
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
