[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel-visual"
version = "0.3.0"
description = "Optional animated 2D/3D run visualizer for keel core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["keel-workflow>=1.4.0"]

[project.scripts]
keel-visual = "keel_visual.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keel_visual"]

[tool.hatch.build.targets.wheel.force-include]
"src/keel_visual/templates/runviz.html" = "keel_visual/templates/runviz.html"
"src/keel_visual/templates/board.html" = "keel_visual/templates/board.html"

[tool.coverage.run]
branch = true
source = ["keel_visual"]
omit = ["*/templates/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = ["if __name__ == .__main__.:", "raise SystemExit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
